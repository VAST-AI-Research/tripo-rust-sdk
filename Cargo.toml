[package]
name = "tripo3d-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Unofficial Rust SDK for the Tripo3D v3 AI 3D generation API (openapi.tripo3d.com/v3)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/vast-enterprise/tripo-rust-sdk"
keywords = ["tripo3d", "tripo", "3d", "ai", "sdk"]
categories = ["api-bindings", "graphics"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
thiserror = "1"
url = "2"
rand = "0.8"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6"
anyhow = "1"

[[example]]
name = "text_to_model"
path = "examples/text_to_model.rs"

[[example]]
name = "image_to_model"
path = "examples/image_to_model.rs"

[[example]]
name = "rig_and_animate"
path = "examples/rig_and_animate.rs"

[[example]]
name = "text_to_image"
path = "examples/text_to_image.rs"

[[example]]
name = "image_to_image"
path = "examples/image_to_image.rs"
