name: Publish to crates.io

# Publishes via crates.io Trusted Publishing (OIDC) — no CARGO_REGISTRY_TOKEN
# stored as a repository secret. crates.io verifies the workflow identity
# instead, which is why the filename must stay `publish.yml` to match the
# Trusted Publishing entry registered on crates.io.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub mint the OIDC token crates.io authenticates against

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$crate" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # Exchanges the OIDC token for a crates.io token valid for 30 minutes,
      # and revokes it in a post step once the job finishes.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
