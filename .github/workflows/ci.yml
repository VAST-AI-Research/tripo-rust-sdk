name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: test (stable)
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      # Plain `cargo test` on purpose: `--all-targets` silently drops the
      # doctests, and clippy above already compiles the examples.
      - name: Test
        run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    name: build (MSRV 1.88)
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      # Library only, and `--locked` on purpose. `rust-version` is a promise
      # to consumers, and the test suite's dev-dependencies need a newer
      # toolchain than the library does. Without the committed lockfile this
      # job resolves fresh dependencies on every run, so a transitive crate
      # raising its own MSRV would break the build with nothing changed here
      # — which is exactly how the previous 1.86 claim went stale within a
      # day.
      - name: Build
        run: cargo build --locked

      - name: Check the declared MSRV matches this job
        run: |
          declared="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')"
          if [ "$declared" != "1.88" ]; then
            echo "Cargo.toml rust-version is $declared but this job verifies 1.88" >&2
            exit 1
          fi
